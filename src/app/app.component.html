<main id="body-inner">
  <app-navbar></app-navbar>
  <div id="tt-content-wrap">
    <router-outlet></router-outlet>
  </div>
  <app-lats-connect></app-lats-connect>

  <app-footer></app-footer>
</main>

<div id="magic-cursor">
  <div id="ball"></div>
</div>

<a
  #scrollToTopButton
  href="#page-header"
  class="tt-scroll-to-top"
  (click)="scrollToTop($event)"
>
  <div class="magnetic-wrap">
    <div class="tt-stt-progress tt-magnetic-item">
      <svg
        class="tt-stt-progress-circle"
        width="100%"
        height="100%"
        viewBox="-1 -1 102 102"
      >
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"></path>
      </svg>
    </div>
  </div>
</a>
@if (isFoundingDay) {
  <app-founding-day-floading-circle />
}
<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  size="medium"
  color="#fff"
  type="square-jelly-box"
  [fullScreen]="true"
  animationDuration="1000"
  template="<img src='img/logo-light.png' /> "
>
</ngx-spinner>
