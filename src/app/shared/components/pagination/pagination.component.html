<nav
  aria-label="Pagination"
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2rem;
  "
>
  <ul
    style="
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
      padding: 0;
    "
  >
    <!-- Previous page button -->
    <li>
      <button
        [disabled]="currentPage === 1"
        [style.opacity]="currentPage === 1 ? '0.5' : '1'"
        [style.cursor]="currentPage === 1 ? 'not-allowed' : 'pointer'"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0.5rem 0.75rem;
          font-size: 0.875rem;
          font-weight: 500;
          color: #4b5563;
          background-color: white;
          border: 1px solid #d1d5db;
          border-radius: 0.5rem;
          transition: all 0.2s;
        "
        (click)="changePage(null, currentPage - 1)"
        (mouseenter)="onButtonHover($event, true)"
        (mouseleave)="onButtonHover($event, false)"
        aria-label="Previous page"
      >
        <svg
          style="width: 1rem; height: 1rem; margin-right: 0.25rem"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 10"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 5H1m0 0 4 4M1 5l4-4"
          />
        </svg>
        <span>Previous</span>
      </button>
    </li>

    <!-- Page number links -->
    <ng-container *ngFor="let link of links; let i = index">
      <!-- Skip first and last items as they are Previous/Next buttons -->
      <li *ngIf="i > 0 && i < links.length - 1">
        <button
          [style.background-color]="link.active ? '#EBF5FF' : 'white'"
          [style.color]="link.active ? '#1E40AF' : '#4B5563'"
          [style.border-color]="link.active ? '#93C5FD' : '#D1D5DB'"
          [style.font-weight]="link.active ? '600' : '500'"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            border: 1px solid;
            border-radius: 0.5rem;
            transition: all 0.2s;
          "
          (click)="changePage(link.url)"
          (mouseenter)="!link.active && onButtonHover($event, true)"
          (mouseleave)="!link.active && onButtonHover($event, false)"
          [attr.aria-current]="link.active ? 'page' : null"
          [attr.aria-label]="'Page ' + link.label"
        >
          {{ link.label }}
        </button>
      </li>
    </ng-container>

    <!-- Next page button -->
    <li>
      <button
        [disabled]="currentPage === lastPage"
        [style.opacity]="currentPage === lastPage ? '0.5' : '1'"
        [style.cursor]="currentPage === lastPage ? 'not-allowed' : 'pointer'"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0.5rem 0.75rem;
          font-size: 0.875rem;
          font-weight: 500;
          color: #4b5563;
          background-color: white;
          border: 1px solid #d1d5db;
          border-radius: 0.5rem;
          transition: all 0.2s;
        "
        (click)="changePage(null, currentPage + 1)"
        (mouseenter)="onButtonHover($event, true)"
        (mouseleave)="onButtonHover($event, false)"
        aria-label="Next page"
      >
        <span>Next</span>
        <svg
          style="width: 1rem; height: 1rem; margin-left: 0.25rem"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 10"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 5h12m0 0L9 1m4 4L9 9"
          />
        </svg>
      </button>
    </li>
  </ul>
</nav>
